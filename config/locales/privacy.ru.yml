    default_text:
      personal_data: |-
        1. Цели обработки: заключение и исполнение договора на техническое обслуживание и ремонт автомобиля, запись на обслуживание, информирование о ходе и результатах работ, напоминания о плановом обслуживании, выполнение требований законодательства о бухгалтерском и налоговом учёте.

        2. Перечень персональных данных: фамилия, имя, отчество; номера телефонов; адрес электронной почты; адрес; паспортные данные (при необходимости оформления документов); сведения об автомобиле (марка, модель, год выпуска, государственный регистрационный знак, VIN, пробег); история обращений, заказ-нарядов и оплат.

        3. Перечень действий: сбор, запись, систематизация, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передача (предоставление, доступ) в случаях, предусмотренных законодательством, обезличивание, блокирование, удаление, уничтожение. Обработка ведётся с использованием средств автоматизации и без них.

        4. Срок действия: согласие действует до достижения целей обработки или до его отзыва. Документы, подлежащие хранению по законодательству о бухгалтерском учёте, хранятся в течение установленного срока, после чего персональные данные уничтожаются или обезличиваются.

        5. Порядок отзыва: согласие может быть отозвано письменным заявлением, переданным оператору лично или направленным по его адресу. После отзыва оператор прекращает обработку и уничтожает или обезличивает персональные данные в срок, не превышающий 30 дней, за исключением случаев, когда обработка допускается законом без согласия.

        Подписывая настоящее согласие, подтверждаю, что ознакомлен(-а) с Политикой оператора в отношении обработки персональных данных.
      marketing: |-
        Даю согласие на получение от оператора рекламной и информационной рассылки об акциях, специальных предложениях и услугах по телефону, SMS, электронной почте и в мессенджерах на указанные мной контактные данные (ст. 18 Федерального закона «О рекламе»).

        Согласие действует до его отзыва. Отказаться от рассылки можно в любой момент, сообщив об этом оператору любым способом, в том числе ответом на сообщение.
