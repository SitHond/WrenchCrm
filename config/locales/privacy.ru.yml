  privacy_policy:
    title: "Политика обработки персональных данных"
    settings_placeholder: "Пусто — публикуется стандартный текст с вашими реквизитами"
    settings_hint_html: "Политика опубликована по адресу %{link}. Разместите ссылку на сайте сервиса. Стандартный текст стоит проверить с юристом."
    default_text: |-
      1. Общие положения. Настоящая Политика определяет порядок обработки и меры по защите персональных данных, которые обрабатывает %{operator} (далее — Оператор), адрес: %{address}, контакты: %{contacts}. Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных».

      2. Цели обработки. Заключение и исполнение договоров на техническое обслуживание и ремонт автомобилей, запись на обслуживание, информирование клиентов о ходе работ и плановом обслуживании, ведение бухгалтерского и налогового учёта, кадровый учёт работников, направление рекламной информации — только при наличии отдельного согласия.

      3. Категории субъектов и данных. Клиенты и их представители: фамилия, имя, отчество, телефон, адрес электронной почты, адрес, паспортные данные при необходимости оформления документов, сведения об автомобиле (марка, модель, год выпуска, государственный регистрационный знак, VIN, пробег), история обращений и оплат. Работники: данные, необходимые для трудовых отношений. Специальные категории и биометрические персональные данные не обрабатываются.

      4. Правовые основания. Согласие субъекта персональных данных, договор, стороной которого является субъект, требования законодательства Российской Федерации.

      5. Порядок обработки. Обработка ведётся с использованием средств автоматизации и без них: сбор, запись, систематизация, накопление, хранение, уточнение, извлечение, использование, передача в случаях, предусмотренных законом, обезличивание, блокирование, удаление и уничтожение. Базы данных с персональными данными граждан Российской Федерации находятся на территории Российской Федерации. Трансграничная передача не осуществляется.

      6. Сроки. Персональные данные обрабатываются до достижения целей обработки или отзыва согласия, если иное не установлено законом. Документы, обязательные к хранению по законодательству о бухгалтерском учёте, хранятся в течение установленного срока, затем персональные данные уничтожаются или обезличиваются.

      7. Права субъекта. Субъект вправе получить сведения об обработке своих персональных данных, требовать их уточнения, блокирования или уничтожения, отозвать согласие, обжаловать действия Оператора в Роскомнадзоре или суде. Запросы направляются Оператору по указанным контактам; ответ даётся в срок, не превышающий 10 рабочих дней.

      8. Меры защиты. Оператор назначает ответственного за организацию обработки персональных данных, ограничивает доступ работников к данным в соответствии с их обязанностями, ведёт журнал доступа, применяет двухфакторную аутентификацию, шифрование каналов связи и резервных копий, регулярно создаёт резервные копии, уведомляет Роскомнадзор об инцидентах в установленные законом сроки.

      9. Заключительные положения. Политика публикуется в открытом доступе и действует бессрочно до замены новой редакцией. Дата редакции: %{updated}.
